<!doctype html>
<html lang="pt-MZ">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="./assets/img/logo-512.png" type="image/png">
		<title>Temply - Controle de clima</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- fonts -->
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- phosphor icons -->
		<script src="https://unpkg.com/@phosphor-icons/web"></script>

		<!-- principal styles -->
		<link rel="stylesheet" href="./css/style.css" />

		<link rel="manifest" href="manifest.json">
	</head>
	<body>
		<div class="container">
			<header class="header">
				<h1>Temply</h1>
				<form id="formSearch">
					<input type="search" id="search" placeholder="Buscar cidade..." />
					<button type="submit" id="btnSearch" aria-label="Buscar cidade">
						<i class="ph ph-magnifying-glass"></i>
					</button>
				</form>
			</header>

			<main>
				<div class="weather">
					<div class="weather-icone" aria-hidden="true">🌤️</div>
					<div class="weather-title"><span id="temperature">--°C</span></div>
					<div class="weather-suggest">Ensolarado / SP</div>
				</div>

				<div class="weather-info">
					<div class="card">
						<h2 class="card-title">Vento</h2>
						<div class="card-info">
							<span id="vento">-- km/h</span>
						</div>
					</div>

					<div class="card">
						<h2 class="card-title">Umidade</h2>
						<div class="card-info">
							<span id="umidade">-- %</span>
						</div>
					</div>

					<div class="card">
						<h2 class="card-title">Sensação</h2>
						<div class="card-info">
							<span id="sensacao">-- °C</span>
						</div>
					</div>
				</div>

				<section class="prevision-list">
					<h2 class="sr-only">Previsão dos próximos dias</h2>
					<div class="list">
						<p>Lista indisponivel atualmente</p>
					</div>
				</section>
			</main>
		</div>

		<script src="./js/script.js" defer></script>
	</body>
</html>
